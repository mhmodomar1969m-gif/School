<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أوائل سبها التعليمية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F5F9;--card:#fff;--tx:#14213D;--mu:#5B6B80;--pr:#1B3A5C;--ac:#16A085;--wa:#E67E22;--rd:#C0392B;--ln:#DCE3EC;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1622;--card:#17233A;--tx:#E8EEF7;--mu:#97A6BC;--pr:#7FB0E6;--ac:#3DD1B0;--wa:#F0A04B;--rd:#F07A6C;--ln:#2A3A55;--on:#0E1622}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Tajawal,Tahoma,Arial,sans-serif;font-size:15px;line-height:1.6;padding-bottom:78px}
.top{background:var(--pr);color:var(--on);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top b{font-size:17px}.lg{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--on);color:var(--pr);align-items:center;justify-content:center;font-weight:800;margin-inline-end:8px}.top small{opacity:.85;display:block;font-size:12px}
main{padding:14px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
h3{margin:0 0 10px;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px}
.stat span{color:var(--mu);font-size:12px;display:block}.stat b{font-size:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}.mu{color:var(--mu);font-size:13px}
button,input,select,textarea{font:inherit;color:var(--tx)}
input,select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;width:100%;margin:3px 0}
.btn{background:var(--pr);color:var(--on);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700}
.btn.s{padding:5px 10px;font-size:13px}.btn.g{background:var(--ac)}.btn.r{background:var(--rd)}.btn.o{background:transparent;color:var(--pr);border:1px solid var(--pr)}
.f{display:flex;gap:6px}.f>*{flex:1}
.tag{display:inline-block;border-radius:20px;padding:1px 10px;font-size:12px;font-weight:700;color:#fff}
.t-r{background:var(--rd)}.t-w{background:var(--wa)}.t-g{background:var(--ac)}
.al{border-inline-start:4px solid var(--wa);background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.al.r{border-color:var(--rd)}.al.g{border-color:var(--ac)}
nav{overflow-x:auto;position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1 0 auto;min-width:66px;background:none;border:0;padding:10px 2px;color:var(--mu);font-size:12px;cursor:pointer;position:relative}
nav button.on{color:var(--pr);font-weight:800;box-shadow:inset 0 3px 0 var(--pr)}
.bd{position:absolute;top:4px;background:var(--rd);color:#fff;border-radius:10px;font-size:10px;padding:0 5px;margin-inline-start:-6px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.roles button{background:var(--card);border:2px solid var(--ln);border-radius:12px;padding:16px 6px;font-weight:800;cursor:pointer}
.roles button.on{border-color:var(--pr);color:var(--pr)}
.bar{height:8px;background:var(--ln);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
@media print{.top,nav,.noprint{display:none!important}body{padding:0;background:#fff}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const T=new Date().toISOString().slice(0,10),SUB=['الرياضيات','العربي','العلوم','الإنجليزي'],CLS0=['الروضة','الصف الأول','الصف الثاني','الصف الثالث','الصف الرابع','الصف الخامس','الصف السادس','الصف السابع','الصف الثامن','الصف التاسع','الأول الثانوي','الثاني الثانوي','الثالث الثانوي'],CLS=CLS0.flatMap(g=>[g+' (أ)',g+' (ب)']);

const seed=()=>({
students:[mk('s1','أحمد العتيبي','الصف السابع',1500,1500,[88,92,85,90],'p1'),mk('s2','سارة العتيبي','الصف الرابع',1200,600,[95,90,97,93],'p1'),mk('s3','خالد الشمري','الصف السابع',1500,750,[48,60,55,42],'p2'),mk('s4','نورة القحطاني','الصف الرابع',1200,0,[72,80,69,75],'p3'),mk('s5','يوسف القحطاني','الروضة',900,900,[90,90,90,90],'p3'),mk('s6','مريم الشمري','الأول الثانوي',2000,1000,[78,82,74,80],'p2')],

inv:[{id:1,n:'أقلام سبورة',q:4,m:10},{id:2,n:'ورق A4 (رزمة)',q:40,m:15},{id:3,n:'كراسي طلاب',q:120,m:100},{id:4,n:'معقم أيدي (لتر)',q:3,m:8}],
exp:[{id:1,n:'رواتب شهرية',a:9000,d:T},{id:2,n:'فاتورة كهرباء',a:600,d:T}],
pay:[],notices:[{id:1,t:'بداية الاختبارات الشهرية الأسبوع القادم',d:T}],msgs:[]});
let S;try{S=JSON.parse(localStorage.getItem('sch3'))}catch(e){}if(!S)S={students:[],users:{admin:[{id:'a1',name:'الإدارة'}],teacher:[],parent:[],student:[]},inv:[],exp:[],pay:[],notices:[],msgs:[],subs:['الرياضيات','العربي','العلوم','الإنجليزي'],sched:{}};
fix();let sb=null,tmr;try{if(window.SUPABASE_URL&&window.supabase)sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}catch(e){}
const save=()=>{try{localStorage.setItem('sch3',JSON.stringify(S))}catch(e){}if(sb){clearTimeout(tmr);tmr=setTimeout(()=>sb.from('school_state').upsert({id:1,data:S}).then(r=>{if(r.error)console.error(r.error)}),600)}};
let me=null,tab='home',pick={role:'admin'},cls=null,W='',pf=null,pt=null,CF=false,CF2=false,CL='',RF='',RP=null,E=null,TC=null,DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
const nm=s=>String(s).trim().replace(/[أإآ]/g,'ا').replace(/\s+/g,' ');const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id),v=id=>$(id).value,n=id=>+v(id)||0;
const fm=x=>x.toLocaleString('ar-SA')+' د.ل';
const avg=s=>{const g=Object.values(s.grades);return g.length?Math.round(g.reduce((a,b)=>a+b,0)/g.length):null};const low=s=>{const a=avg(s);return a!==null&&a<60};
const kids=()=>me.role==='parent'?S.students.filter(s=>s.parent===me.id):S.students.filter(s=>s.id===me.id);
function conflicts(){const c=[],d=(L,f,t)=>{const m={};L.forEach(x=>{const k=nm(f(x));m[k]=(m[k]||0)+1});Object.keys(m).forEach(k=>{if(m[k]>1)c.push(t+' «'+k.replace('|',' – ')+'» مكرر '+m[k]+' مرات')})};
d(S.students,s=>s.name+'|'+s.cls,'الطالب');
const bn={};S.students.forEach(s=>{const k=nm(s.name);(bn[k]=bn[k]||new Set()).add(s.cls)});Object.keys(bn).forEach(k=>{if(bn[k].size>1)c.push('الطالب «'+k+'» مسجل في أكثر من فصل: '+[...bn[k]].join('، '))});
d(S.users.parent,p=>p.name,'ولي الأمر');d(S.users.teacher,p=>p.name,'المعلم');d(S.inv,i=>i.n,'صنف الجرد');d(S.subs,x=>x,'المادة');
S.students.forEach(s=>{if(!S.users.parent.some(p=>p.id===s.parent))c.push('الطالب «'+s.name+'» بدون ولي أمر مرتبط')});
S.users.teacher.forEach(t=>{if(!t.cls.length)c.push('المعلم «'+t.name+'» غير مرتبط بأي فصل')});
S.tt.forEach((x,i)=>S.tt.forEach((y,j)=>{if(j>i&&x.day===y.day&&x.per===y.per){if(x.tid===y.tid)c.push('تعارض: المعلم «'+tnm(x.tid)+'» لديه حصتان معاً يوم '+x.day+' الحصة '+x.per+' ('+x.cls+' و'+y.cls+')');if(x.cls===y.cls)c.push('تعارض: '+x.cls+' لديه حصتان معاً يوم '+x.day+' الحصة '+x.per)}}));
S.tt.forEach(x=>{const t=S.users.teacher.find(t=>t.id===x.tid);if(!t||!t.cls.includes(x.cls))c.push('المعلم «'+tnm(x.tid)+'» غير مسند للفصل '+x.cls+' (حصة '+x.subj+')')});
return c}
function tnm(id){return(S.users.teacher.find(t=>t.id===id)||{name:'؟'}).name}
function nextCls(c){const i=CLS.indexOf(c);return i>=0&&i+2<CLS.length?CLS[i+2]:null}
function alerts(){const a=[];
if(me.role==='admin'){conflicts().forEach(c=>a.push(['r','⚠️ تداخل: '+esc(c)]));if(!S.users.admin[0].pw)a.push(['w','عيّن كلمة مرور للإدارة من تبويب «البيانات»']);S.inv.filter(i=>i.q<=i.m).forEach(i=>a.push(['r','نقص مخزون: '+i.n+' (المتبقي '+i.q+' والحد الأدنى '+i.m+')']));
const u=S.students.filter(s=>s.fee>s.paid);if(u.length)a.push(['w',u.length+' طلاب عليهم رسوم غير مسددة بإجمالي '+fm(u.reduce((x,s)=>x+s.fee-s.paid,0))]);
const ab=S.students.filter(s=>s.att[T]==='غ');if(ab.length)a.push(['w','غياب اليوم: '+ab.map(s=>s.name).join('، ')]);
S.students.filter(low).forEach(s=>a.push(['r','تدني مستوى: '+s.name+' (المعدل '+avg(s)+'%)']))}
if(me.role==='teacher'){const t=S.users.teacher.find(x=>x.id===me.id);S.students.filter(s=>t.cls.includes(s.cls)).forEach(s=>{if(s.att[T]==='غ')a.push(['w','غائب اليوم: '+s.name]);if(low(s))a.push(['r','يحتاج متابعة: '+s.name+' ('+avg(s)+'%)'])})}
if(me.role==='parent'||me.role==='student')kids().forEach(s=>{if(s.att[T]==='غ')a.push(['r',s.name+' غائب اليوم']);if(me.role==='parent'&&s.fee>s.paid)a.push(['w','رسوم متبقية على '+s.name+': '+fm(s.fee-s.paid)]);if(low(s))a.push(['r','معدل '+s.name+' منخفض ('+avg(s)+'%)'])});
S.msgs.filter(m=>m.to==='all'||m.to===me.role||kids().some(k=>k.id===m.to)).forEach(m=>a.push(['g','رسالة من '+esc(m.from)+': '+esc(m.t)]));
return a}
const AL=a=>a.length?a.map(x=>`<div class="al ${x[0]==='r'?'r':x[0]==='g'?'g':''}">${x[1]}</div>`).join(''):'<p class="mu">لا توجد تنبيهات 👌</p>';
const NAV={admin:[['home','الرئيسية'],['reg','التسجيل'],['acc','الحسابات'],['inv','الجرد'],['set','البيانات'],['mv','الترحيل'],['msg','التنبيهات']],teacher:[['home','الرئيسية'],['att','الحضور'],['grd','الدرجات'],['sch','الجدول'],['msg','التنبيهات']],parent:[['home','الرئيسية'],['grd','الدرجات'],['fee','الرسوم'],['msg','التنبيهات']],staff:[['home','الرئيسية'],['reg','التسجيل'],['pay','الرسوم'],['msg','التنبيهات']],student:[['home','الرئيسية'],['grd','الدرجات'],['sch','الجدول'],['msg','التنبيهات']]};
const RN={admin:'الإدارة',staff:'موظف إداري',teacher:'معلم',parent:'ولي أمر',student:'طالب'};
function go(t){tab=t;W='';CF=false;draw()}
function login(){const w=$('who');if(!w||!w.value)return;const u=S.users[pick.role].find(x=>x.id===w.value);if(u.pw&&u.pw!==hp(v('pw'))){W='كلمة المرور غير صحيحة';return draw()}W='';me={role:pick.role,id:w.value};tab='home';draw()}
function out(){me=null;draw()}
function draw(){const A=$('app');
if(!me){A.innerHTML=`<div class="top"><b><span class="lg">أ</span>أوائل سبها التعليمية</b></div><main>${W?`<div class="al r"><b>تنبيه:</b> ${esc(W)}</div>`:''}<div class="card"><h3>تسجيل الدخول</h3><p class="mu">اختر نوع الحساب ثم المستخدم.</p>
<div class="roles">${Object.keys(RN).map(r=>`<button class="${pick.role===r?'on':''}" onclick="pick.role='${r}';draw()">${{admin:'🏛️',teacher:'👩‍🏫',parent:'👪',student:'🎒',staff:'🗂️'}[r]}<br>${RN[r]}</button>`).join('')}</div>
${S.users[pick.role].length?`<select id="who">${S.users[pick.role].map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select><input id="pw" type="password" placeholder="كلمة المرور"><br><button class="btn" style="width:100%" onclick="login()">دخول</button>`:'<p class="al">لا يوجد مستخدمون بعد. ادخل كإدارة وأضفهم من تبويب «البيانات».</p>'}</div></main>`;return}
const u=S.users[me.role].find(x=>x.id===me.id),na=alerts().length;
A.innerHTML=`<div class="top"><div><b><span class="lg">أ</span>أوائل سبها التعليمية</b><small>${RN[me.role]} · ${esc(u.name)}</small></div><button class="btn s o" style="color:var(--on);border-color:var(--on)" onclick="out()">خروج</button></div><main>${W?`<div class="al r"><b>⚠️ تنبيه:</b> ${esc(W)}</div>`:''}${VIEW[me.role+'_'+tab]?VIEW[me.role+'_'+tab]():VIEW[tab]()}</main>
<nav>${NAV[me.role].map(x=>`<button class="${tab===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}${x[0]==='msg'&&na?`<span class="bd">${na}</span>`:''}</button>`).join('')}</nav>`}
const stat=(l,x)=>`<div class="stat"><span>${l}</span><b>${x}</b></div>`;
const tot=()=>{const d=S.students.reduce((a,s)=>a+s.fee,0),p=S.students.reduce((a,s)=>a+s.paid,0),e=S.exp.reduce((a,x)=>a+x.a,0);return{d,p,e,net:p-e}};
const LBL={student:'الطلاب',parent:'أولياء الأمور',teacher:'المعلمون',staff:'الموظفون'},LBL1={student:'طالب',parent:'ولي أمر',teacher:'معلم',staff:'موظف'};
const TTV=(L,t,k)=>`<div class="card"><h3>${t}</h3>${L.length?DAYS.map(d=>{const r=L.filter(x=>x.day===d).sort((a,b)=>a.per-b.per);return r.length?`<div class="row"><b>${d}</b><span class="mu">${r.map(x=>x.per+': '+esc(x.subj)+(k?' ('+x.cls+')':'')).join(' · ')}</span></div>`:''}).join(''):'<p class="mu">لم تُدخل الإدارة الجدول بعد.</p>'}</div>`;
const VIEW={
home(){const al=alerts().slice(0,3);let b='';
if(me.role==='admin'){const t=tot();b=`<div class="grid">${stat('الطلاب',S.students.length)}${stat('المعلمون',S.users.teacher.length)}${stat('المحصّل',fm(t.p))}${stat('الصافي',fm(t.net))}</div><br><div class="card"><h3>الطلاب حسب الفصل</h3>${CLS.filter(c=>S.students.some(s=>s.cls===c)).map(c=>`<div class="row"><span>${c}</span><b>${S.students.filter(s=>s.cls===c).length}</b></div>`).join('')||'<p class="mu">لا يوجد طلاب بعد</p>'}</div>`}
else if(me.role==='teacher'){const t=S.users.teacher.find(x=>x.id===me.id);b=`<div class="grid">${stat('فصولي',t.cls.length)}${stat('طلابي',S.students.filter(s=>t.cls.includes(s.cls)).length)}</div><br>`}
else if(me.role==='staff')b=`<div class="grid">${stat('الطلاب',S.students.length)}${stat('أولياء الأمور',S.users.parent.length)}</div><br>`;
else b=kids().map(s=>`<div class="card"><h3>${esc(s.name)}</h3><div class="mu">${s.cls} · الحضور اليوم: ${s.att[T]==='ح'?'حاضر':s.att[T]==='غ'?'غائب':'لم يُسجَّل'}</div><br><div class="bar"><i style="width:${avg(s)||0}%"></i></div><div class="mu">${avg(s)===null?'لم تُرصد درجات بعد':'المعدل '+avg(s)+'%'}</div></div>`).join('');
return b+`<div class="card"><h3>آخر التنبيهات</h3>${AL(al)}</div><div class="card"><h3>الإعلانات</h3>${S.notices.map(x=>`<div class="row"><span>${esc(x.t)}</span><span class="mu">${x.d}</span></div>`).join('')}</div>`},
msg(){const a=me.role==='admin'||me.role==='teacher';
let f='';if(a)f=`<div class="card"><h3>إرسال تنبيه</h3><select id="mt"><option value="all">الجميع</option><option value="parent">أولياء الأمور</option><option value="teacher">المعلمون</option>${S.students.map(s=>`<option value="${s.id}">ولي/طالب: ${esc(s.name)}</option>`).join('')}</select><input id="mx" placeholder="نص التنبيه"><br>
<div class="f"><button class="btn g" onclick="sendMsg()">إرسال</button>${me.role==='admin'?'<button class="btn o" onclick="addNotice()">نشر كإعلان</button>':''}</div></div>`;
return f+`<div class="card"><h3>نقاط التنبيه</h3>${AL(alerts())}</div>`},

ب</button></div>`},

admin_inv(){const tv=S.inv.reduce((a,i)=>a+i.q*(i.p||0),0),la=S.audits.slice(-1)[0];return `<div class="grid">${stat('عدد الأصناف',S.inv.length)}${stat('إجمالي القطع',S.inv.reduce((a,i)=>a+i.q,0))}${stat('قيمة المخزون',fm(tv))}${stat('أصناف ناقصة',S.inv.filter(i=>i.q<=i.m).length)}</div><br><div class="card"><h3>الجرد والمخزون</h3><p class="mu">للجرد الفعلي: اكتب الكمية الموجودة فعلاً أمام كل صنف ثم اضغط «اعتماد الجرد».</p>${S.inv.map(i=>`<div class="row"><div>${esc(i.n)}<div class="mu">الحد الأدنى ${i.m} · السعر ${fm(i.p||0)}</div></div><div class="f" style="flex:none;align-items:center"><button class="btn s o" onclick="adj(${i.id},-1)">−</button><b class="${i.q<=i.m?'':''}" style="min-width:34px;text-align:center;color:${i.q<=i.m?'var(--rd)':'inherit'}">${i.q}</b><button class="btn s o" onclick="adj(${i.id},1)">+</button><input id="ac_${i.id}" type="number" placeholder="الفعلي" style="width:72px"></div></div>`).join('')}</div>

const sv=()=>{W='';save();draw()};
function payFee(id){const a=n('p_'+id),s=S.students.find(x=>x.id===id);if(a>s.fee-s.paid){W='المبلغ أكبر من المتبقي على '+s.name+' ('+fm(s.fee-s.paid)+')';return draw()}if(a>0){s.paid=Math.min(s.fee,s.paid+a);S.pay.push({id,a,d:T});sv()}}
function addExp(){if(v('en')&&n('ea')>0){S.exp.push({id:Date.now(),n:v('en'),a:n('ea'),d:T});sv()}}
function adj(id,d){const i=S.inv.find(x=>x.id===id);i.q=Math.max(0,i.q+d);sv()}
function addInv(){if(v('in')){if(S.inv.some(i=>nm(i.n)===nm(v('in')))){W='الصنف «'+v('in').trim()+'» مسجل مسبقاً، عدّل كميته من القائمة';return draw()}S.inv.push({id:Date.now(),n:v('in'),q:n('iq'),m:n('im'),p:n('ip')});sv()}}
function addStu(){if(v('sn').trim()){if(S.students.some(s=>nm(s.name)===nm(v('sn'))&&s.cls===v('sc'))){W='الطالب «'+v('sn').trim()+'» مسجل مسبقاً في '+v('sc');return draw()}const id='s'+Date.now();S.students.push(mk(id,v('sn'),v('sc'),n('sf'),0,{},v('sp')));S.users.student.push({id,name:v('sn')});edit('student',id,tab)}}
function addPar(){if(v('pn').trim()){if(S.users.parent.some(p=>nm(p.name)===nm(v('pn')))){W='ولي الأمر «'+v('pn').trim()+'» مسجل مسبقاً';return draw()}const id='p'+Date.now();S.users.parent.push({id,name:v('pn').trim()});edit('parent',id,tab)}}
function addTch(){if(v('tn').trim()){if(S.users.teacher.some(p=>nm(p.name)===nm(v('tn')))){W='المعلم «'+v('tn').trim()+'» مسجل مسبقاً';return draw()}S.users.teacher.push({id:'t'+Date.now(),name:v('tn'),cls:[...$('tc').selectedOptions].map(o=>o.value)});sv()}}
function addSub(){if(v('bn').trim()){if(S.subs.some(x=>nm(x)===nm(v('bn')))){W='المادة «'+v('bn').trim()+'» موجودة مسبقاً';return draw()}S.subs.push(v('bn').trim());sv()}}
function setSch(){S.sched[v('hc')]=v('ht');sv()}
function del(k,id){S.users[k]=S.users[k].filter(x=>x.id!==id);if(k==='student')S.students=S.students.filter(x=>x.id!==id);if(k==='teacher')S.tt=S.tt.filter(x=>x.tid!==id);sv()}
function addSlot(){const e={id:Date.now(),cls:v('tcl'),day:v('tdy'),per:+v('tpr'),subj:v('tsb'),tid:v('ttc')};if(!e.tid||!e.subj){W='أضف معلماً ومادة أولاً';return draw()}const t=S.users.teacher.find(x=>x.id===e.tid);if(!t.cls.includes(e.cls)){W='المعلم «'+t.name+'» غير مسند للفصل '+e.cls+'، أضف الفصل لبياناته أولاً';return draw()}const o=S.tt.find(x=>x.day===e.day&&x.per===e.per&&(x.cls===e.cls||x.tid===e.tid));if(o){W=o.cls===e.cls?'الفصل '+e.cls+' لديه حصة في هذا الوقت':'المعلم لديه حصة في '+o.cls+' في نفس الوقت';return draw()}S.tt.push(e);sv()}
function fix(){S.tt=S.tt||[];S.grad=S.grad||[];S.closes=S.closes||[];S.audits=S.audits||[];S.sal=S.sal||[];S.users.staff=S.users.staff||[];S.flds=S.flds||{student:['رقم الهاتف','تاريخ الميلاد','ملاحظات'],parent:['رقم الهاتف','العنوان'],teacher:['رقم الهاتف','الراتب'],staff:['رقم الهاتف','الوظيفة','الراتب']}}
function edit(k,id,b){save();E={k,id,back:b};tab='ed';W='';draw()}
function saveEd(){const k=E.k,o=k==='student'?S.students.find(x=>x.id===E.id):S.users[k].find(x=>x.id===E.id),nn=v('e_n').trim();if(!nn){W='الاسم مطلوب';return draw()}
if(k==='student'){const c=v('e_c');if(S.students.some(x=>x!==o&&nm(x.name)===nm(nn)&&x.cls===c)){W='الطالب «'+nn+'» مسجل مسبقاً في '+c;return draw()}if(n('e_f')<o.paid){W='الرسوم أقل من المدفوع ('+fm(o.paid)+')';return draw()}o.cls=c;o.fee=n('e_f');o.parent=v('e_p');const u=S.users.student.find(x=>x.id===o.id);if(u)u.name=nn}
else if(S.users[k].some(x=>x!==o&&nm(x.name)===nm(nn))){W='الاسم «'+nn+'» مسجل مسبقاً';return draw()}
else if(k==='teacher')o.cls=[...$('e_t').selectedOptions].map(x=>x.value);
const ul=k==='student'?S.users.student.find(x=>x.id===o.id):o;if(ul&&v('e_pw'))ul.pw=hp(v('e_pw'));o.name=nn;o.ex={};(S.flds[k]||[]).forEach((f,i)=>o.ex[f]=v('x_'+i));tab=E.back;sv()}
function addEmp(){const nn=v('em').trim();if(!nn)return;if(S.users.staff.some(x=>nm(x.name)===nm(nn))){W='الموظف «'+nn+'» مسجل مسبقاً';return draw()}const id='m'+Date.now();S.users.staff.push({id,name:nn});edit('staff',id,'set')}
function addFld(){const f=v('fn').trim(),k=v('fk');if(!f)return;if(S.flds[k].some(x=>nm(x)===nm(f))){W='الخانة موجودة مسبقاً';return draw()}S.flds[k].push(f);sv()}
function delFld(k,i){S.flds[k].splice(i,1);sv()}
function doAudit(){const rows=[];S.inv.forEach(i=>{const e=$('ac_'+i.id);if(e&&e.value!==''){const a=+e.value;rows.push({n:i.n,sys:i.q,act:a,diff:a-i.q});i.q=a}});if(!rows.length){W='اكتب الكمية الفعلية لصنف واحد على الأقل';return draw()}S.audits.push({d:T,rows});sv()}
function doClose(){const t=tot(),db=S.students.filter(s=>s.fee>s.paid).map(s=>({n:s.name+' ('+s.cls+')',r:s.fee-s.paid}));S.closes.push({l:CL||'فترة '+T,d:T,t,iv:S.inv.reduce((a,i)=>a+i.q*(i.p||0),0),db,exp:S.exp.slice(),pay:S.pay.length});S.exp=[];S.pay=[];S.students.forEach(s=>{s.fee=s.fee-s.paid;s.paid=0});CF2=false;CL='';sv()}
function hp(s){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return String(h)}
function setAp(){if(v('ap').length<4){W='كلمة المرور قصيرة (4 أحرف على الأقل)';return draw()}S.users.admin[0].pw=hp(v('ap'));sv()}
function wa(s){const p=S.users.parent.find(x=>x.id===s.parent);let d=((p&&p.ex&&p.ex['رقم الهاتف'])||'').replace(/\D/g,'');if(!d)return '';if(d[0]==='0')d='218'+d.slice(1);const t='السلام عليكم، نفيدكم بأن المتبقي من رسوم '+s.name+' هو '+fm(s.fee-s.paid)+'. إدارة أوائل سبها التعليمية';return `<a class="btn s g" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener" href="https://wa.me/${d}?text=${encodeURIComponent(t)}">واتساب</a>`}
function paySal(){const m=T.slice(0,7);let k=0;[...S.users.teacher,...S.users.staff].forEach(p=>{const a=parseFloat(p.ex&&p.ex['الراتب']),key=m+'|'+p.id;if(a>0&&!S.sal.includes(key)){S.exp.push({id:Date.now()+k,n:'راتب '+p.name,a,d:T});S.sal.push(key);k++}});sv();W=k?'تم صرف رواتب '+k+' موظف لشهر '+m:'لا رواتب جديدة: تأكد من إدخال الراتب في «تعديل» أو أنها صُرفت لهذا الشهر';draw()}
function delSlot(id){S.tt=S.tt.filter(x=>x.id!==id);sv()}
function impBk(){try{const o=JSON.parse(v('bk'));if(!o.students||!o.users)throw 0;S=o;fix();sv()}catch(e){W='النسخة غير صالحة';draw()}}
function moveS(s,t,nf){s.hist=(s.hist||[]).concat({cls:s.cls,g:s.grades});s.grades={};s.att={};if(nf>0){s.fee=s.fee-s.paid+nf;s.paid=0}if(t==='grad'){S.grad.push(s);S.students=S.students.filter(x=>x.id!==s.id);S.users.student=S.users.student.filter(x=>x.id!==s.id)}else s.cls=t}
function mvSel(){const L=S.students.filter(s=>s.cls===pf&&$('ck_'+s.id)&&$('ck_'+s.id).checked);if(!L.length){W='لم تحدد أي طالب';return draw()}if(pt===pf){W='فصل الوجهة هو نفسه فصل المصدر';return draw()}const d=L.filter(s=>pt!=='grad'&&S.students.some(x=>x!==s&&x.cls===pt&&nm(x.name)===nm(s.name)));if(d.length){W='لا يمكن الترحيل: يوجد طالب بنفس الاسم في '+pt+' ('+d.map(s=>s.name).join('، ')+')';return draw()}L.forEach(s=>moveS(s,pt,n('nf')));pf=null;pt=null;sv()}
function mvAll(){S.students.slice().forEach(s=>{const i=CLS.indexOf(s.cls);if(i<0)return;moveS(s,i+2<CLS.length?CLS[i+2]:'grad',0)});CF=false;pf=null;pt=null;sv()}
function delSub(i){S.subs.splice(i,1);sv()}
function att(id,x){S.students.find(s=>s.id===id).att[T]=x;sv()}
function setG(){if(!$('gs')||!v('gs')||!v('gj'))return;const s=S.students.find(x=>x.id===v('gs')),g=n('gv');if(g>=0&&g<=100&&v('gv')!==''){s.grades[v('gj')]=g;sv()}else{W='الدرجة يجب أن تكون بين 0 و100';draw()}}
function sendMsg(){if(v('mx').trim()){S.msgs.unshift({to:v('mt'),from:S.users[me.role].find(x=>x.id===me.id).name,t:v('mx')});sv()}}
function addNotice(){if(v('mx').trim()){S.notices.unshift({id:Date.now(),t:v('mx'),d:T});sv()}}
async function pull(){const r=await sb.from('school_state').select('data').eq('id',1).maybeSingle();if(r.data&&r.data.data){S=r.data.data;fix()}else{await sb.from('school_state').upsert({id:1,data:S})}}
function gate(){$('app').innerHTML=`<div class="top"><b><span class="lg">أ</span>أوائل سبها التعليمية</b></div><main><div class="card"><h3>دخول النظام</h3><p class="mu">أدخل البريد وكلمة المرور اللذين زوّدتك بهما الإدارة.</p><input id="ce" type="email" placeholder="البريد الإلكتروني"><input id="cp" type="password" placeholder="كلمة المرور"><p id="cm" class="mu" style="color:var(--rd)"></p><button class="btn" style="width:100%" onclick="cloudLogin()">دخول</button></div></main>`}
async function cloudLogin(){const r=await sb.auth.signInWithPassword({email:$('ce').value.trim(),password:$('cp').value});if(r.error){$('cm').textContent='بيانات الدخول غير صحيحة';return}boot()}
async function boot(){if(!sb){draw();return}const g=await sb.auth.getSession();if(!g.data.session){gate();return}await pull();draw();window.addEventListener('focus',async()=>{if(!me||document.activeElement===document.body){await pull();draw()}})}
boot();
</script>
</body>
